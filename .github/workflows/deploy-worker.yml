name: Deploy My AI Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Cloudflare secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is NOT available"
            exit 1
          fi

          if [ -z "$CF_ACCOUNT" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is NOT available"
            exit 1
          fi

          echo "✅ Both Cloudflare secrets are available"
