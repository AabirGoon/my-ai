<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f7f8;
      --white: #ffffff;
      --text: #202123;
      --muted: #707070;
      --border: #e5e5e5;
      --dark: #202123;
      --danger: #b42318;
      --success: #15803d;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 64px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      position: sticky;
      top: 0;
      z-index: 20;

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #666;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .account-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .account-btn:hover {
      background: #f5f5f5;
    }

    /* =========================
       AUTH SCREEN
    ========================= */

    .auth-screen {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 35px 20px 80px;
    }

    .auth-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.05);
    }

    .auth-card h1 {
      font-size: 28px;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .auth-tabs {
      display: flex;
      gap: 6px;
      background: #f1f1f2;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 9px;
      padding: 10px;
      color: #777;
      font-size: 14px;
    }

    .auth-tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      font-weight: 600;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      border: 1px solid #d8d8d8;
      outline: none;
      background: white;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #999;
    }

    .auth-submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--dark);
      color: white;
      padding: 13px;
      font-size: 15px;
      margin-top: 4px;
    }

    .auth-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .auth-message {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #666;
    }

    .auth-message.error {
      color: var(--danger);
    }

    .auth-message.success {
      color: var(--success);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;

      padding:
        55px
        20px
        150px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 40px;
    }

    .welcome h1 {
      font-size: clamp(31px, 7vw, 48px);
      font-weight: 700;
      letter-spacing: -1.8px;
      margin-bottom: 13px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      width: 100%;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 14px 17px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--dark);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: white;
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .sources {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: #666;
    }

    .sources-title {
      font-weight: 600;
      margin-bottom: 7px;
      color: #444;
    }

    .source-item {
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .source-item a {
      color: #555;
      text-decoration: underline;
    }

    /* =========================
       THINKING
    ========================= */

    .thinking {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: #777;
      font-size: 14px;
    }

    .thinking-line {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .thinking-status {
      font-size: 12px;
      color: #999;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #777;
      animation: blink 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      background: rgba(247,247,248,.96);
      border-top: 1px solid var(--border);

      padding:
        13px
        20px
        17px;

      backdrop-filter: blur(12px);
    }

    .input-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      gap: 9px;

      background: white;
      border: 1px solid #d8d8d8;
      border-radius: 18px;

      padding:
        7px
        7px
        7px
        15px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;

      min-height: 45px;
      max-height: 140px;

      resize: none;

      border: none;
      outline: none;

      background: transparent;
      color: var(--text);

      font-size: 15px;
      line-height: 1.5;

      padding:
        10px
        0;
    }

    textarea::placeholder {
      color: #999;
    }

    #sendBtn {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;
      border-radius: 14px;

      background: var(--dark);
      color: white;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform .15s,
        opacity .15s;
    }

    #sendBtn:hover {
      opacity: .88;
    }

    #sendBtn:active {
      transform: scale(.94);
    }

    #sendBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hint {
      width: 100%;
      max-width: 900px;
      margin: 7px auto 0;

      text-align: center;
      color: #999;
      font-size: 10px;
    }

    /* =========================
       CHAT SIDEBAR
    ========================= */

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      z-index: 50;
    }

    .drawer {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      width: min(330px, 88vw);

      background: white;

      z-index: 51;

      box-shadow: 10px 0 35px rgba(0,0,0,.12);

      display: flex;
      flex-direction: column;

      transform: translateX(-100%);
      transition: transform .2s ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;

      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-weight: 700;
    }

    .drawer-close {
      border: none;
      background: transparent;
      font-size: 22px;
      color: #666;
    }

    .new-chat-btn {
      margin: 14px;
      padding: 11px 13px;

      border: 1px solid var(--border);
      background: white;

      border-radius: 11px;

      font-size: 13px;
      text-align: left;
    }

    .new-chat-btn:hover {
      background: #f5f5f5;
    }

    .chat-list {
      overflow-y: auto;
      padding: 0 9px 20px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }

    .chat-open {
      flex: 1;

      border: none;
      background: transparent;

      padding: 11px 9px;

      text-align: left;

      border-radius: 9px;

      font-size: 13px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-open:hover {
      background: #f4f4f5;
    }

    .chat-delete {
      width: 30px;
      height: 30px;

      border: none;
      background: transparent;

      color: #999;

      border-radius: 8px;
      font-size: 14px;
    }

    .chat-delete:hover {
      background: #f5f5f5;
      color: var(--danger);
    }

    .empty-chats {
      padding: 25px 15px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    /* =========================
       ACCOUNT MENU
    ========================= */

    .account-menu {
      position: fixed;
      top: 58px;
      right: 15px;

      width: 260px;

      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;

      padding: 10px;

      z-index: 40;

      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    .account-email {
      padding: 9px;
      font-size: 12px;
      color: #777;
      overflow-wrap: anywhere;
      border-bottom: 1px solid var(--border);
      margin-bottom: 7px;
    }

    .menu-btn {
      width: 100%;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 9px;
      text-align: left;
      font-size: 13px;
    }

    .menu-btn:hover {
      background: #f5f5f5;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 15px;
      }

      .online {
        display: none;
      }

      .account-btn {
        padding: 7px 10px;
      }

      main {
        padding:
          38px
          13px
          135px;
      }

      .welcome {
        margin-bottom: 32px;
      }

      .welcome h1 {
        font-size: 31px;
      }

      .welcome p {
        font-size: 14px;
      }

      .bubble {
        max-width: 90%;
      }

      .input-area {
        padding:
          9px
          9px
          13px;
      }

      .input-box {
        border-radius: 17px;
      }

      .auth-screen {
        padding:
          25px
          14px
          70px;
      }

      .auth-card {
        border-radius: 18px;
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTHENTICATION
  ========================== -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-card">

      <h1>My AI</h1>

      <p id="authDescription">
        Sign in to use My AI and save your conversations.
      </p>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="auth-tab active"
          type="button"
        >
          Sign in
        </button>

        <button
          id="signupTab"
          class="auth-tab"
          type="button"
        >
          Create account
        </button>

      </div>

      <form id="authForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
            minlength="6"
          >

        </div>

        <button
          id="authSubmit"
          class="auth-submit"
          type="submit"
        >
          Sign in
        </button>

      </form>

      <div
        id="authMessage"
        class="auth-message"
      ></div>

    </div>

  </section>


  <!-- =========================
       MAIN APP
  ========================== -->

  <div
    id="app"
    class="app hidden"
  >

    <header>

      <div
        class="logo"
        id="logoButton"
        style="cursor:pointer;"
        title="Open chats"
      >
        My AI
      </div>

      <div class="header-right">

        <div class="online">

          <span class="online-dot"></span>

          AI online

        </div>

        <button
          id="accountBtn"
          class="account-btn"
          type="button"
        >
          Account
        </button>

      </div>

    </header>


    <!-- ACCOUNT MENU -->

    <div
      id="accountMenu"
      class="account-menu hidden"
    >

      <div
        id="accountEmail"
        class="account-email"
      ></div>

      <button
        id="newChatMenuBtn"
        class="menu-btn"
        type="button"
      >
        New chat
      </button>

      <button
        id="logoutBtn"
        class="menu-btn"
        type="button"
      >
        Sign out
      </button>

    </div>


    <!-- CHAT DRAWER -->

    <div
      id="drawerOverlay"
      class="drawer-overlay hidden"
    ></div>

    <aside
      id="drawer"
      class="drawer"
    >

      <div class="drawer-header">

        <div class="drawer-title">
          Your chats
        </div>

        <button
          id="drawerClose"
          class="drawer-close"
          type="button"
          aria-label="Close chats"
        >
          ×
        </button>

      </div>

      <button
        id="newChatBtn"
        class="new-chat-btn"
        type="button"
      >
        ＋ New chat
      </button>

      <div
        id="chatList"
        class="chat-list"
      ></div>

    </aside>


    <!-- MAIN -->

    <main>

      <div
        class="welcome"
        id="welcome"
      >

        <h1>
          What can I help you with?
        </h1>

        <p>
          Ask anything. Learn, write, think, plan and explore.
        </p>

      </div>

      <div id="chat"></div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask anything..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          aria-label="Send message"
          type="button"
        >
          ↑
        </button>

      </div>

      <div class="hint">
        My AI can make mistakes. Check important information.
      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const BACKEND_URL =
      "https://my-ai-backend.techaabir.workers.dev/";

    const SUPABASE_URL =
      "https://gmkgorihdhqhbahrruym.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable__fN6yItD7X1TErhmJp35Pg_k0L9FaRa";


    /* =====================================================
       STORAGE
    ===================================================== */

    const SESSION_KEY =
      "myai_session";

    const CURRENT_CHAT_KEY =
      "myai_current_chat";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const authScreen =
      document.getElementById("authScreen");

    const authForm =
      document.getElementById("authForm");

    const authDescription =
      document.getElementById("authDescription");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const authSubmit =
      document.getElementById("authSubmit");

    const authMessage =
      document.getElementById("authMessage");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const app =
      document.getElementById("app");

    const accountBtn =
      document.getElementById("accountBtn");

    const accountMenu =
      document.getElementById("accountMenu");

    const accountEmail =
      document.getElementById("accountEmail");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const newChatMenuBtn =
      document.getElementById("newChatMenuBtn");

    const logoButton =
      document.getElementById("logoButton");

    const drawer =
      document.getElementById("drawer");

    const drawerOverlay =
      document.getElementById("drawerOverlay");

    const drawerClose =
      document.getElementById("drawerClose");

    const newChatBtn =
      document.getElementById("newChatBtn");

    const chatList =
      document.getElementById("chatList");

    const promptInput =
      document.getElementById("prompt");

    const sendBtn =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");


    /* =====================================================
       STATE
    ===================================================== */

    let isSignupMode = false;

    let session = null;

    let currentChatId =
      localStorage.getItem(CURRENT_CHAT_KEY) || null;

    let currentUser = null;


    /* =====================================================
       AUTH MESSAGE
    ===================================================== */

    function setAuthMessage(
      text,
      type = ""
    ) {

      authMessage.textContent =
        text;

      authMessage.className =
        "auth-message" +
        (type ? " " + type : "");

    }


    /* =====================================================
       SUPABASE REQUEST
    ===================================================== */

    async function supabaseRequest(
      endpoint,
      options = {}
    ) {

      const headers = {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        ...(options.headers || {})
      };

      const response =
        await fetch(
          SUPABASE_URL + endpoint,
          {
            ...options,
            headers
          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = null;

      }

      if (!response.ok) {

        throw new Error(
          data?.msg ||
          data?.message ||
          data?.error_description ||
          data?.error ||
          "Authentication request failed."
        );

      }

      return data;

    }


    /* =====================================================
       SIGN UP
    ===================================================== */

    async function signUp(
      email,
      password
    ) {

      return await supabaseRequest(
        "/auth/v1/signup",
        {
          method: "POST",
          body: JSON.stringify({
            email,
            password
          })
        }
      );

    }


    /* =====================================================
       SIGN IN
    ===================================================== */

    async function signIn(
      email,
      password
    ) {

      return await supabaseRequest(
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",
          body: JSON.stringify({
            email,
            password
          })
        }
      );

    }


    /* =====================================================
       SAVE SESSION
    ===================================================== */

    function saveSession(data) {

      session = {
        access_token:
          data.access_token,

        refresh_token:
          data.refresh_token,

        expires_at:
          data.expires_at ||
          (
            Math.floor(
              Date.now() / 1000
            ) +
            (
              data.expires_in ||
              3600
            )
          ),

        user:
          data.user || null
      };

      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
      );

    }


    /* =====================================================
       GET USER FROM JWT
    ===================================================== */

    function getUserFromJWT(token) {

      try {

        const parts =
          token.split(".");

        if (parts.length !== 3) {
          return null;
        }

        const normalized =
          parts[1]
            .replace(/-/g, "+")
            .replace(/_/g, "/");

        const padded =
          normalized +
          "=".repeat(
            (
              4 -
              normalized.length % 4
            ) % 4
          );

        const payload =
          JSON.parse(
            atob(padded)
          );

        if (!payload?.sub) {
          return null;
        }

        return {
          id: payload.sub,
          email: payload.email || ""
        };

      } catch {

        return null;

      }

    }


    /* =====================================================
       REFRESH SESSION
    ===================================================== */

    async function refreshSession() {

      const saved =
        localStorage.getItem(
          SESSION_KEY
        );

      if (!saved) {
        return null;
      }

      let oldSession;

      try {

        oldSession =
          JSON.parse(saved);

      } catch {

        localStorage.removeItem(
          SESSION_KEY
        );

        return null;

      }

      if (!oldSession?.refresh_token) {
        return null;
      }

      try {

        const data =
          await supabaseRequest(
            "/auth/v1/token?grant_type=refresh_token",
            {
              method: "POST",
              body: JSON.stringify({
                refresh_token:
                  oldSession.refresh_token
              })
            }
          );

        if (data?.access_token) {

          saveSession(data);

          return data;

        }

      } catch (error) {

        console.warn(
          "Session refresh failed:",
          error
        );

      }

      localStorage.removeItem(
        SESSION_KEY
      );

      session = null;
      currentUser = null;

      return null;

    }


    /* =====================================================
       ENSURE VALID SESSION
    ===================================================== */

    async function ensureValidSession() {

      const saved =
        localStorage.getItem(
          SESSION_KEY
        );

      if (!saved) {
        return false;
      }

      try {

        session =
          JSON.parse(saved);

      } catch {

        localStorage.removeItem(
          SESSION_KEY
        );

        session = null;

        return false;

      }

      if (!session?.access_token) {
        return false;
      }

      const expiresAt =
        Number(
          session.expires_at || 0
        );

      const now =
        Math.floor(
          Date.now() / 1000
        );

      if (
        expiresAt &&
        expiresAt < now + 60
      ) {

        const refreshed =
          await refreshSession();

        if (!refreshed) {
          return false;
        }

      }

      currentUser =
        session.user ||
        getUserFromJWT(
          session.access_token
        );

      if (!currentUser) {
        return false;
      }

      return true;

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

      session = null;
      currentUser = null;

      localStorage.removeItem(
        SESSION_KEY
      );

      localStorage.removeItem(
        CURRENT_CHAT_KEY
      );

      currentChatId = null;

      closeAccountMenu();
      closeDrawer();

      chat.innerHTML = "";

      welcome.style.display = "";

      app.classList.add(
        "hidden"
      );

      authScreen.classList.remove(
        "hidden"
      );

      passwordInput.value = "";

      setAuthMessage("");

      updateAuthMode();

    }


    /* =====================================================
       AUTH MODE
    ===================================================== */

    function updateAuthMode() {

      if (isSignupMode) {

        signupTab.classList.add(
          "active"
        );

        loginTab.classList.remove(
          "active"
        );

        authSubmit.textContent =
          "Create account";

        authDescription.textContent =
          "Create a free account to use My AI and save your conversations.";

        passwordInput.autocomplete =
          "new-password";

      } else {

        loginTab.classList.add(
          "active"
        );

        signupTab.classList.remove(
          "active"
        );

        authSubmit.textContent =
          "Sign in";

        authDescription.textContent =
          "Sign in to use My AI and save your conversations.";

        passwordInput.autocomplete =
          "current-password";

      }

    }


    /* =====================================================
       AUTH FORM
    ===================================================== */

    authForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {
          return;
        }

        authSubmit.disabled = true;

        setAuthMessage(
          isSignupMode
            ? "Creating your account..."
            : "Signing you in..."
        );

        try {

          let data;

          if (isSignupMode) {

            data =
              await signUp(
                email,
                password
              );

            if (!data?.access_token) {

              setAuthMessage(
                "Account created. Check your email and confirm your account, then sign in.",
                "success"
              );

              passwordInput.value = "";

              return;

            }

          } else {

            data =
              await signIn(
                email,
                password
              );

          }

          if (!data?.access_token) {

            throw new Error(
              "No login session was returned."
            );

          }

          saveSession(data);

          currentUser =
            data.user ||
            getUserFromJWT(
              data.access_token
            );

          showApp();

          await loadChatList();

          await restoreCurrentChat();

        } catch (error) {

          console.error(
            "Authentication error:",
            error
          );

          setAuthMessage(
            error.message ||
            "Authentication failed.",
            "error"
          );

        } finally {

          authSubmit.disabled =
            false;

        }

      }
    );


    /* =====================================================
       AUTH TABS
    ===================================================== */

    loginTab.addEventListener(
      "click",
      function() {

        isSignupMode = false;

        setAuthMessage("");

        updateAuthMode();

      }
    );


    signupTab.addEventListener(
      "click",
      function() {

        isSignupMode = true;

        setAuthMessage("");

        updateAuthMode();

      }
    );


    /* =====================================================
       SHOW APP
    ===================================================== */

    function showApp() {

      authScreen.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );

      accountEmail.textContent =
        currentUser?.email ||
        "Signed in";

    }


    /* =====================================================
       AUTHENTICATED BACKEND REQUEST
    ===================================================== */

    async function backendRequest(
      path,
      options = {}
    ) {

      if (!session?.access_token) {

        const valid =
          await ensureValidSession();

        if (!valid) {

          logout();

          throw new Error(
            "Your session has expired. Please sign in again."
          );

        }

      }

      const expiresAt =
        Number(
          session.expires_at || 0
        );

      const now =
        Math.floor(
          Date.now() / 1000
        );

      if (
        expiresAt &&
        expiresAt < now + 60
      ) {

        const refreshed =
          await refreshSession();

        if (!refreshed) {

          logout();

          throw new Error(
            "Your session has expired. Please sign in again."
          );

        }

      }

      const headers = {
        "Content-Type":
          "application/json",

        "Authorization":
          "Bearer " +
          session.access_token,

        ...(options.headers || {})
      };

      const url =
        BACKEND_URL +
        path.replace(
          /^\/+/,
          ""
        );

      let response;

      try {

        response =
          await fetch(
            url,
            {
              ...options,
              headers
            }
          );

      } catch (error) {

        throw new Error(
          "Could not connect to the AI server."
        );

      }

      if (response.status === 401) {

        const refreshed =
          await refreshSession();

        if (refreshed) {

          headers.Authorization =
            "Bearer " +
            session.access_token;

          try {

            response =
              await fetch(
                url,
                {
                  ...options,
                  headers
                }
              );

          } catch {

            throw new Error(
              "Could not connect to the AI server."
            );

          }

        }

      }

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "The AI server returned an invalid response."
        );

      }

      if (!response.ok) {

        throw new Error(
          data?.error ||
          data?.message ||
          "The server request failed."
        );

      }

      return data;

    }


    /* =====================================================
       SCROLL TO BOTTOM
    ===================================================== */

    function scrollToBottom() {

      requestAnimationFrame(
        function() {

          window.scrollTo({
            top:
              document.documentElement
                .scrollHeight,
            behavior: "smooth"
          });

        }
      );

    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(
      type,
      text,
      sources = null
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + type;

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        text || "";

      message.appendChild(
        bubble
      );

      if (
        type === "ai" &&
        Array.isArray(sources) &&
        sources.length
      ) {

        const sourceBox =
          document.createElement(
            "div"
          );

        sourceBox.className =
          "sources";

        const title =
          document.createElement(
            "div"
          );

        title.className =
          "sources-title";

        title.textContent =
          "Sources used";

        sourceBox.appendChild(
          title
        );

        sources.forEach(
          function(source, index) {

            if (!source?.title) {
              return;
            }

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "source-item";

            const label =
              document.createElement(
                "span"
              );

            label.textContent =
              "[" +
              (index + 1) +
              "] " +
              source.title;

            item.appendChild(
              label
            );

            if (source.url) {

              item.appendChild(
                document.createTextNode(
                  " — "
                )
              );

              const link =
                document.createElement(
                  "a"
                );

              link.href =
                source.url;

              link.target =
                "_blank";

              link.rel =
                "noopener noreferrer";

              link.textContent =
                "Open source";

              item.appendChild(
                link
              );

            }

            sourceBox.appendChild(
              item
            );

          }
        );

        bubble.appendChild(
          sourceBox
        );

      }

      chat.appendChild(
        message
      );

      scrollToBottom();

      return bubble;

    }


    /* =====================================================
       THINKING MESSAGE
    ===================================================== */

    function createThinking() {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message ai";

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble thinking";

      bubble.innerHTML = `
        <div class="thinking-line">
          <span class="thinking-label">
            Thinking
          </span>

          <span class="dots">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>

        <div
          class="thinking-status"
        >
          Understanding your request...
        </div>
      `;

      message.appendChild(
        bubble
      );

      chat.appendChild(
        message
      );

      scrollToBottom();

      const status =
        bubble.querySelector(
          ".thinking-status"
        );

      let step = 0;

      const statuses = [
        "Understanding your request...",
        "Working on it...",
        "Checking the best approach...",
        "Preparing your answer..."
      ];

      const interval =
        setInterval(
          function() {

            step++;

            if (status) {

              status.textContent =
                statuses[
                  step %
                  statuses.length
                ];

            }

          },
          1600
        );

      message._thinkingInterval =
        interval;

      return message;

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

      const prompt =
        promptInput.value.trim();

      if (!prompt) {
        return;
      }

      /*
       * Clear the input immediately after
       * accepting the message.
       */

      promptInput.value = "";

      promptInput.style.height =
        "auto";

      /*
       * Prevent duplicate submissions.
       */

      if (sendBtn.disabled) {
        return;
      }

      sendBtn.disabled = true;

      /*
       * Make sure the user is authenticated.
       */

      let valid = false;

      try {

        valid =
          await ensureValidSession();

      } catch (error) {

        console.error(
          "Session validation error:",
          error
        );

        valid = false;

      }

      if (!valid) {

        sendBtn.disabled = false;

        logout();

        setAuthMessage(
          "Please sign in again.",
          "error"
        );

        return;

      }

      welcome.style.display =
        "none";

      addMessage(
        "user",
        prompt
      );

      const thinking =
        createThinking();

      try {

        const data =
          await backendRequest(
            "/api/ask",
            {
              method: "POST",

              body: JSON.stringify({
                prompt:
                  prompt,

                chatId:
                  currentChatId
              })
            }
          );

        if (
          thinking &&
          thinking._thinkingInterval
        ) {

          clearInterval(
            thinking._thinkingInterval
          );

        }

        if (thinking) {
          thinking.remove();
        }

        if (
          !data ||
          !data.success
        ) {

          throw new Error(
            data?.error ||
            "Something went wrong."
          );

        }

        let answer = "";

        if (
          data.result &&
          typeof data.result ===
          "object"
        ) {

          if (
            typeof data.result.response ===
            "string"
          ) {

            answer =
              data.result.response;

          } else if (
            typeof data.result.result ===
            "string"
          ) {

            answer =
              data.result.result;

          } else {

            answer =
              JSON.stringify(
                data.result,
                null,
                2
              );

          }

        } else if (
          typeof data.result ===
          "string"
        ) {

          answer =
            data.result;

        }

        if (!answer) {

          answer =
            "The AI responded, but no readable answer was returned.";

        }

        if (data.chatId) {

          currentChatId =
            data.chatId;

          localStorage.setItem(
            CURRENT_CHAT_KEY,
            currentChatId
          );

        }

        addMessage(
          "ai",
          answer,
          data.sources || null
        );

        await loadChatList();

      } catch (error) {

        console.error(
          "My AI error:",
          error
        );

        if (
          thinking &&
          thinking._thinkingInterval
        ) {

          clearInterval(
            thinking._thinkingInterval
          );

        }

        if (thinking) {
          thinking.remove();
        }

        addMessage(
          "ai",
          "Sorry, something went wrong.\n\n" +
          (
            error?.message ||
            "Please try again."
          )
        );

      } finally {

        sendBtn.disabled =
          false;

        promptInput.focus();

      }

    }


    /* =====================================================
       RENDER SAVED CHAT
    ===================================================== */

    function renderSavedChat(
      savedChat
    ) {

      chat.innerHTML = "";

      welcome.style.display =
        "none";

      if (
        !savedChat ||
        !Array.isArray(
          savedChat.messages
        )
      ) {

        welcome.style.display =
          "";

        return;

      }

      savedChat.messages.forEach(
        function(message) {

          if (
            message.role ===
            "user"
          ) {

            addMessage(
              "user",
              message.content
            );

          } else if (
            message.role ===
            "assistant"
          ) {

            addMessage(
              "ai",
              message.content,
              message.sources
            );

          }

        }
      );

      scrollToBottom();

    }


    /* =====================================================
       LOAD SAVED CHAT LIST
    ===================================================== */

    async function loadChatList() {

      try {

        const data =
          await backendRequest(
            "/api/chats",
            {
              method: "GET"
            }
          );

        renderChatList(
          data?.chats || []
        );

      } catch (error) {

        console.error(
          "Could not load chats:",
          error
        );

        renderChatList([]);

      }

    }


    /* =====================================================
       RENDER CHAT LIST
    ===================================================== */

    function renderChatList(
      chats
    ) {

      chatList.innerHTML = "";

      if (
        !Array.isArray(chats) ||
        chats.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty-chats";

        empty.textContent =
          "No saved chats yet.";

        chatList.appendChild(
          empty
        );

        return;

      }

      chats.forEach(
        function(item) {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "chat-row";

          const open =
            document.createElement(
              "button"
            );

          open.className =
            "chat-open";

          open.type =
            "button";

          open.textContent =
            item.title ||
            "Untitled chat";

          open.title =
            item.title ||
            "Untitled chat";

          open.addEventListener(
            "click",
            function() {

              loadChat(
                item.id
              );

            }
          );

          const del =
            document.createElement(
              "button"
            );

          del.className =
            "chat-delete";

          del.type =
            "button";

          del.textContent =
            "×";

          del.setAttribute(
            "aria-label",
            "Delete chat"
          );

          del.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

              deleteChat(
                item.id
              );

            }
          );

          row.appendChild(
            open
          );

          row.appendChild(
            del
          );

          chatList.appendChild(
            row
          );

        }
      );

    }


    /* =====================================================
       LOAD ONE CHAT
    ===================================================== */

    async function loadChat(
      chatId
    ) {

      if (!chatId) {
        return;
      }

      try {

        const data =
          await backendRequest(
            "/api/chats/" +
            encodeURIComponent(
              chatId
            ),
            {
              method: "GET"
            }
          );

        if (
          !data?.success ||
          !data.chat
        ) {

          throw new Error(
            data?.error ||
            "Chat could not be loaded."
          );

        }

        currentChatId =
          data.chat.id;

        localStorage.setItem(
          CURRENT_CHAT_KEY,
          currentChatId
        );

        renderSavedChat(
          data.chat
        );

        closeDrawer();

      } catch (error) {

        console.error(
          "Load chat error:",
          error
        );

        addMessage(
          "ai",
          "I couldn't open that conversation."
        );

      }

    }


    /* =====================================================
       RESTORE CURRENT CHAT
    ===================================================== */

    async function restoreCurrentChat() {

      if (!currentChatId) {

        chat.innerHTML = "";

        welcome.style.display =
          "";

        return;

      }

      try {

        await loadChat(
          currentChatId
        );

      } catch {

        currentChatId = null;

        localStorage.removeItem(
          CURRENT_CHAT_KEY
        );

        chat.innerHTML = "";

        welcome.style.display =
          "";

      }

    }


    /* =====================================================
       DELETE CHAT
    ===================================================== */

    async function deleteChat(
      chatId
    ) {

      if (!chatId) {
        return;
      }

      const confirmed =
        window.confirm(
          "Delete this conversation?"
        );

      if (!confirmed) {
        return;
      }

      try {

        const data =
          await backendRequest(
            "/api/chats/" +
            encodeURIComponent(
              chatId
            ),
            {
              method: "DELETE"
            }
          );

        if (!data?.success) {

          throw new Error(
            data?.error ||
            "Could not delete chat."
          );

        }

        if (
          currentChatId ===
          chatId
        ) {

          currentChatId = null;

          localStorage.removeItem(
            CURRENT_CHAT_KEY
          );

          chat.innerHTML = "";

          welcome.style.display =
            "";

        }

        await loadChatList();

      } catch (error) {

        console.error(
          "Delete chat error:",
          error
        );

        alert(
          error?.message ||
          "Could not delete this chat."
        );

      }

    }


    /* =====================================================
       NEW CHAT
    ===================================================== */

    async function newChat() {

      try {

        const data =
          await backendRequest(
            "/api/chats",
            {
              method: "POST",

              body: JSON.stringify({
                title:
                  "New Chat"
              })
            }
          );

        if (
          !data?.success ||
          !data.chat
        ) {

          throw new Error(
            data?.error ||
            "Could not create a new chat."
          );

        }

        currentChatId =
          data.chat.id;

        localStorage.setItem(
          CURRENT_CHAT_KEY,
          currentChatId
        );

        chat.innerHTML = "";

        welcome.style.display =
          "";

        closeDrawer();
        closeAccountMenu();

        promptInput.focus();

        await loadChatList();

      } catch (error) {

        console.error(
          "New chat error:",
          error
        );

        currentChatId = null;

        localStorage.removeItem(
          CURRENT_CHAT_KEY
        );

        chat.innerHTML = "";

        welcome.style.display =
          "";

        closeDrawer();

      }

    }


    /* =====================================================
       DRAWER
    ===================================================== */

    function openDrawer() {

      drawer.classList.add(
        "open"
      );

      drawerOverlay.classList.remove(
        "hidden"
      );

      loadChatList();

    }


    function closeDrawer() {

      drawer.classList.remove(
        "open"
      );

      drawerOverlay.classList.add(
        "hidden"
      );

    }


    logoButton.addEventListener(
      "click",
      openDrawer
    );

    drawerClose.addEventListener(
      "click",
      closeDrawer
    );

    drawerOverlay.addEventListener(
      "click",
      closeDrawer
    );

    newChatBtn.addEventListener(
      "click",
      newChat
    );


    /* =====================================================
       ACCOUNT MENU
    ===================================================== */

    function openAccountMenu() {

      accountMenu.classList.remove(
        "hidden"
      );

    }


    function closeAccountMenu() {

      accountMenu.classList.add(
        "hidden"
      );

    }


    accountBtn.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        if (
          accountMenu.classList.contains(
            "hidden"
          )
        ) {

          openAccountMenu();

        } else {

          closeAccountMenu();

        }

      }
    );


    accountMenu.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

      }
    );


    document.addEventListener(
      "click",
      function() {

        closeAccountMenu();

      }
    );


    logoutBtn.addEventListener(
      "click",
      logout
    );


    newChatMenuBtn.addEventListener(
      "click",
      newChat
    );


    /* =====================================================
       SEND BUTTON
    ===================================================== */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* =====================================================
       ENTER TO SEND
       SHIFT + ENTER = NEW LINE
    ===================================================== */

    promptInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       AUTO RESIZE
    ===================================================== */

    promptInput.addEventListener(
      "input",
      function() {

        this.style.height =
          "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            140
          ) + "px";

      }
    );


    /* =====================================================
       INITIALIZATION
    ===================================================== */

    async function initialize() {

      updateAuthMode();

      const valid =
        await ensureValidSession();

      if (!valid) {

        authScreen.classList.remove(
          "hidden"
        );

        app.classList.add(
          "hidden"
        );

        return;

      }

      showApp();

      await loadChatList();

      await restoreCurrentChat();

    }


    /* =====================================================
       START
    ===================================================== */

    initialize();

  </script>

</body>
