<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f7f8;
      --white: #ffffff;
      --text: #202123;
      --muted: #707070;
      --border: #e5e5e5;
      --dark: #202123;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 64px;

      background: rgba(255,255,255,0.96);

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      position: sticky;
      top: 0;

      z-index: 20;

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 12px;
      color: #666;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #22c55e;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      flex: 1;

      padding:
        55px
        20px
        150px;
    }

    .welcome {
      text-align: center;

      margin-bottom: 40px;
    }

    .welcome h1 {
      font-size: clamp(31px, 7vw, 48px);

      font-weight: 700;

      letter-spacing: -1.8px;

      margin-bottom: 13px;
    }

    .welcome p {
      color: var(--muted);

      font-size: 15px;

      line-height: 1.6;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      display: flex;
      flex-direction: column;

      gap: 20px;
    }

    .message {
      width: 100%;

      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;

      padding: 14px 17px;

      border-radius: 18px;

      font-size: 15px;

      line-height: 1.65;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--dark);

      color: white;

      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: white;

      border: 1px solid var(--border);

      border-bottom-left-radius: 5px;
    }

    /* =========================
       THINKING
    ========================= */

    .thinking {
      display: flex;

      align-items: center;

      gap: 9px;

      color: #777;

      font-size: 14px;
    }

    .dots {
      display: flex;

      gap: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #777;

      animation: blink 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      background: rgba(247,247,248,.96);

      border-top: 1px solid var(--border);

      padding:
        13px
        20px
        17px;

      backdrop-filter: blur(12px);
    }

    .input-box {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      display: flex;

      align-items: flex-end;

      gap: 9px;

      background: white;

      border: 1px solid #d8d8d8;

      border-radius: 18px;

      padding:
        7px
        7px
        7px
        15px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;

      min-height: 45px;
      max-height: 140px;

      resize: none;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 15px;

      line-height: 1.5;

      padding:
        10px
        0;
    }

    textarea::placeholder {
      color: #999;
    }

    #sendBtn {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;

      border-radius: 14px;

      background: var(--dark);

      color: white;

      font-size: 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      transition:
        transform .15s,
        opacity .15s;
    }

    #sendBtn:hover {
      opacity: .88;
    }

    #sendBtn:active {
      transform: scale(.94);
    }

    #sendBtn:disabled {
      opacity: .45;

      cursor: not-allowed;
    }

    .hint {
      width: 100%;
      max-width: 900px;

      margin:
        7px
        auto
        0;

      text-align: center;

      color: #999;

      font-size: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 15px;
      }

      main {
        padding:
          38px
          13px
          135px;
      }

      .welcome {
        margin-bottom: 32px;
      }

      .welcome h1 {
        font-size: 31px;
      }

      .welcome p {
        font-size: 14px;
      }

      .bubble {
        max-width: 90%;
      }

      .input-area {
        padding:
          9px
          9px
          13px;
      }

      .input-box {
        border-radius: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header>

      <div class="logo">
        My AI
      </div>

      <div class="online">
        <span class="online-dot"></span>
        AI online
      </div>

    </header>


    <!-- MAIN -->

    <main>

      <div
        class="welcome"
        id="welcome"
      >

        <h1>
          What can I help you with?
        </h1>

        <p>
          Ask anything. Learn, write, think, plan and explore.
        </p>

      </div>


      <div id="chat"></div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask anything..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          aria-label="Send message"
          type="button"
        >
          ↑
        </button>

      </div>

      <div class="hint">
        My AI can make mistakes. Check important information.
      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       MY AI BACKEND
       ===================================================== */

    const BACKEND_URL =
      "https://my-ai-backend.techaabir.workers.dev/";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const promptInput =
      document.getElementById("prompt");

    const sendBtn =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");


    /* =====================================================
       ADD MESSAGE
       ===================================================== */

    function addMessage(type, text) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      bubble.textContent =
        text;


      message.appendChild(bubble);

      chat.appendChild(message);


      scrollToBottom();


      return bubble;
    }


    /* =====================================================
       SCROLL
       ===================================================== */

    function scrollToBottom() {

      setTimeout(() => {

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });

      }, 50);

    }


    /* =====================================================
       THINKING MESSAGE
       ===================================================== */

    function createThinking() {

      const message =
        document.createElement("div");

      message.className =
        "message ai";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble thinking";


      bubble.innerHTML = `
        <span>Thinking</span>

        <span class="dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      `;


      message.appendChild(bubble);

      chat.appendChild(message);


      scrollToBottom();


      return message;
    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      const prompt =
        promptInput.value.trim();


      if (!prompt) {
        return;
      }


      /* Hide welcome screen */

      welcome.style.display =
        "none";


      /* Show user message */

      addMessage(
        "user",
        prompt
      );


      /* Clear input */

      promptInput.value = "";

      promptInput.style.height =
        "auto";


      /* Disable send */

      sendBtn.disabled =
        true;


      /* Thinking */

      const thinking =
        createThinking();


      try {

        const response =
          await fetch(
            BACKEND_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                prompt: prompt
              })
            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "The AI server returned an invalid response."
          );

        }


        /* Remove thinking */

        thinking.remove();


        /* Backend error */

        if (
          !response.ok ||
          !data.success
        ) {

          const error =
            data &&
            data.error
              ? data.error
              : "Something went wrong.";


          addMessage(
            "ai",
            "Sorry, something went wrong.\n\n" +
            error
          );


          return;
        }


        /* =================================================
           EXTRACT WORKERS AI RESPONSE
           ================================================= */

        let answer = "";


        if (
          data.result &&
          typeof data.result === "object"
        ) {

          if (
            typeof data.result.response ===
            "string"
          ) {

            answer =
              data.result.response;

          }

          else if (
            typeof data.result.result ===
            "string"
          ) {

            answer =
              data.result.result;

          }

          else {

            answer =
              JSON.stringify(
                data.result,
                null,
                2
              );

          }

        }

        else if (
          typeof data.result ===
          "string"
        ) {

          answer =
            data.result;

        }


        if (!answer) {

          answer =
            "The AI responded, but no readable answer was returned.";

        }


        /* Show AI answer */

        addMessage(
          "ai",
          answer
        );


      } catch (error) {

        console.error(
          "My AI error:",
          error
        );


        thinking.remove();


        addMessage(
          "ai",
          "I couldn't connect to the AI server.\n\n" +
          "Please try again."
        );

      }


      finally {

        sendBtn.disabled =
          false;

        promptInput.focus();

      }

    }


    /* =====================================================
       SEND BUTTON
       ===================================================== */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* =====================================================
       ENTER TO SEND
       SHIFT + ENTER = NEW LINE
       ===================================================== */

    promptInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       AUTO RESIZE
       ===================================================== */

    promptInput.addEventListener(
      "input",
      function() {

        this.style.height =
          "auto";


        this.style.height =
          Math.min(
            this.scrollHeight,
            140
          ) + "px";

      }
    );

  </script>

</body>
  </html>
